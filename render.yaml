services:
  - type: web
    name: artillegence-ai
    env: docker
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VITE_API_URL
        value: "" # Leave empty for same-origin proxying in Docker
    disk:
      name: artillegence-data
      mountPath: /data
      sizeGB: 1
